<h2>Listado General de Pokémon</h2>

<div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px;">
  @for (poke of misPokemones; track poke.id) {
    <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; width: 140px; background-color: #fff;">
      <img [src]="poke.img" [alt]="poke.nombre" width="100" height="100">
      <h3 style="text-transform: capitalize; margin: 10px 0 5px 0;">{{ poke.nombre }}</h3>
      <a [routerLink]="['/pokemon', poke.nombre]" style="color: #007bff; text-decoration: none; font-weight: bold;">Ver detalle</a>
    </div>
  }
</div>
